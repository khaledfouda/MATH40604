project:
  type: book
  output-dir: _book

book:
  title: "Advanced Mathematical Tools for Management"
  subtitle: "MATH 40604 — Course Notes"
  author: ""
  date: today
  date-format: "D MMMM YYYY"
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - chapters/week01.qmd
  page-footer:
    left: "MATH 40604 — Course Notes"
    right: ""

bibliography: []

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: true
    html-math-method: mathjax
    code-copy: true
    fig-align: center

  pdf:
    documentclass: scrreprt
    papersize: letter
    geometry:
      - margin=2.5cm
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    # Notation macros for the PDF path. The HTML path gets the same macros from _macros.qmd
    include-in-header:
      - file: tex/macros.tex

editor: visual
